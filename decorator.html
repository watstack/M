<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0, user-scalable=no">
<title>Decorator</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  :root {
    --paper:  #efece5;
    --canvas: #ffffff;
    --panel:  #ffffff;
    --ink:    #23262b;
    --muted:  #767c85;
    --line:   #dcd7cc;
    --line-2: #eceae4;
    --accent: #2f6f8f;
    --accent-soft: #e2eef4;
    --warn:   #b5563f;
    --radius: 8px;
    --topbar-h: 52px;
    --mobilebar-h: 58px;
  }

  html, body { height: 100%; overscroll-behavior: none; }

  body {
    font-family: 'DM Sans', system-ui, -apple-system, sans-serif;
    background: var(--paper);
    color: var(--ink);
    font-size: 14px;
    -webkit-tap-highlight-color: transparent;
  }

  /* ------------------------------------------------------------- layout -- */

  .app {
    height: 100dvh;
    display: grid;
    grid-template-columns: 260px 1fr 290px;
    grid-template-rows: var(--topbar-h) 1fr;
    grid-template-areas:
      "topbar topbar topbar"
      "left   stage  right";
  }

  .topbar {
    grid-area: topbar;
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 0 12px;
    background: var(--panel);
    border-bottom: 1px solid var(--line);
    min-width: 0;
    overflow: hidden;
  }
  .topbar > * { flex: 0 0 auto; }

  .brand {
    font-weight: 700;
    letter-spacing: -0.01em;
    white-space: nowrap;
    margin-right: 4px;
    flex: 0 1 auto;
    min-width: 0;
    overflow: hidden;
  }
  .brand span { color: var(--accent); }

  .stage {
    grid-area: stage;
    position: relative;
    background: var(--canvas);
    overflow: hidden;
    min-width: 0;
    min-height: 0;
  }

  #canvas {
    width: 100%;
    height: 100%;
    display: block;
    touch-action: none;
    cursor: grab;
  }
  #canvas.is-dragging { cursor: grabbing; }

  /* The dock holds both panels. On desktop `display:contents` lets them fall
     into the grid as sidebars; on mobile it becomes one slide-up drawer. */
  .dock { display: contents; }

  .panel {
    background: var(--panel);
    border-right: 1px solid var(--line);
    overflow-y: auto;
    overscroll-behavior: contain;
    min-height: 0;
  }
  #panelCatalog  { grid-area: left; }
  #panelInspector{ grid-area: right; border-right: 0; border-left: 1px solid var(--line); }

  .dock-handle, .dock-tabs, .mobilebar { display: none; }

  /* -------------------------------------------------------------- pieces -- */

  .seg {
    display: inline-flex;
    background: var(--line-2);
    border-radius: 6px;
    padding: 2px;
    gap: 2px;
  }
  .seg button {
    font: inherit;
    font-size: 13px;
    border: 0;
    background: transparent;
    color: var(--muted);
    padding: 6px 11px;
    border-radius: 4px;
    cursor: pointer;
    white-space: nowrap;
  }
  .seg button[aria-pressed="true"] { background: var(--panel); color: var(--ink); font-weight: 500; box-shadow: 0 1px 2px rgba(0,0,0,.12); }

  .btn {
    font: inherit;
    font-size: 13px;
    border: 1px solid var(--line);
    background: var(--panel);
    color: var(--ink);
    padding: 7px 12px;
    border-radius: 6px;
    cursor: pointer;
    white-space: nowrap;
    min-height: 34px;
  }
  .btn:hover:not(:disabled) { background: var(--line-2); }
  .btn:disabled { opacity: .4; cursor: default; }
  .btn--primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  .btn--primary:hover:not(:disabled) { background: #27607c; }
  .btn--danger { color: var(--warn); }
  .btn--icon { padding: 7px 9px; min-width: 34px; }
  .btn--block { display: block; width: 100%; }

  .spacer { flex: 1 1 auto; }

  .section { padding: 12px; border-bottom: 1px solid var(--line-2); }
  .section:last-child { border-bottom: 0; }

  .section h2 {
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: .07em;
    color: var(--muted);
    font-weight: 700;
    margin-bottom: 9px;
  }

  .hint { font-size: 12px; color: var(--muted); line-height: 1.5; }

  .cat-group { margin-bottom: 12px; }
  .cat-group:last-child { margin-bottom: 0; }
  .cat-group > h3 {
    font-size: 12px;
    font-weight: 700;
    margin-bottom: 6px;
    color: var(--muted);
  }
  .cat-list { display: flex; flex-direction: column; gap: 4px; }

  .cat-item {
    display: flex;
    align-items: center;
    gap: 9px;
    width: 100%;
    font: inherit;
    font-size: 13px;
    text-align: left;
    border: 1px solid transparent;
    background: transparent;
    color: var(--ink);
    padding: 7px 8px;
    border-radius: 6px;
    cursor: grab;
    touch-action: none;
    min-height: 38px;
  }
  .cat-item:hover { background: var(--accent-soft); border-color: #cfe2ea; }
  .cat-item .sw {
    width: 22px; height: 16px;
    border-radius: 3px;
    border: 1px solid rgba(0,0,0,.22);
    flex: 0 0 auto;
  }
  .cat-item .sw.round { border-radius: 50%; width: 18px; height: 18px; }
  .cat-item .dims { margin-left: auto; font-family: 'DM Mono', monospace; font-size: 11px; color: var(--muted); }

  .rows { display: flex; flex-direction: column; gap: 9px; }
  .row { display: flex; align-items: center; gap: 8px; }
  .row label { font-size: 12px; color: var(--muted); flex: 0 0 62px; }
  .row.wide label { flex: 0 0 auto; }

  input[type="text"], input[type="number"], select {
    font: inherit;
    font-size: 13px;
    padding: 7px 8px;
    border: 1px solid var(--line);
    border-radius: 6px;
    background: var(--panel);
    color: var(--ink);
    width: 100%;
    min-width: 0;
    min-height: 34px;
  }
  input[type="color"] {
    width: 42px; height: 34px; padding: 2px;
    border: 1px solid var(--line); border-radius: 6px; background: var(--panel); cursor: pointer;
  }
  input[type="range"] { width: 100%; accent-color: var(--accent); }
  input:focus-visible, select:focus-visible, button:focus-visible {
    outline: 2px solid var(--accent); outline-offset: 1px;
  }

  .check { display: flex; align-items: center; gap: 7px; font-size: 13px; cursor: pointer; min-height: 32px; }
  .check input { width: 16px; height: 16px; accent-color: var(--accent); }

  .swatches { display: grid; grid-template-columns: repeat(7, 1fr); gap: 5px; }
  .swatches button {
    aspect-ratio: 1;
    border: 1px solid rgba(0,0,0,.18);
    border-radius: 5px;
    cursor: pointer;
    padding: 0;
  }
  .swatches button[aria-pressed="true"] { outline: 2px solid var(--accent); outline-offset: 1px; }

  .wall-list { display: flex; flex-direction: column; gap: 3px; max-height: 260px; overflow-y: auto; }
  .wall-list button {
    font: inherit; font-size: 13px; text-align: left;
    border: 1px solid transparent; background: transparent; color: var(--ink);
    padding: 7px 8px; border-radius: 6px; cursor: pointer; min-height: 36px;
    display: flex; align-items: center; gap: 8px;
  }
  .wall-list button:hover { background: var(--accent-soft); }
  .wall-list button[aria-pressed="true"] { background: var(--accent-soft); border-color: #cfe2ea; font-weight: 500; }
  .wall-list .len { margin-left: auto; font-family: 'DM Mono', monospace; font-size: 11px; color: var(--muted); }

  .stage-hud {
    position: absolute;
    left: 12px; bottom: 12px;
    display: flex; align-items: center; gap: 10px;
    background: rgba(255,255,255,.92);
    border: 1px solid var(--line);
    border-radius: 8px;
    padding: 6px 9px;
    backdrop-filter: blur(3px);
    pointer-events: none;
  }
  .compass {
    font-family: 'DM Mono', monospace;
    font-size: 12px;
    font-weight: 500;
    color: var(--muted);
    border-left: 1px solid var(--line);
    padding-left: 10px;
    white-space: nowrap;
  }

  .scalebar { pointer-events: none; }
  .scalebar .bar { height: 6px; border: 1px solid var(--ink); border-top: 0; }
  .scalebar .txt { font-family: 'DM Mono', monospace; font-size: 11px; color: var(--muted); margin-top: 2px; }

  .zoomers {
    position: absolute; right: 12px; bottom: 12px;
    display: flex; flex-direction: column; gap: 5px;
  }
  .zoomers .btn { box-shadow: 0 1px 3px rgba(0,0,0,.12); }

  .toast {
    position: absolute;
    left: 50%; transform: translateX(-50%);
    top: 12px;
    background: var(--ink); color: #fff;
    padding: 9px 14px; border-radius: 7px;
    font-size: 13px;
    opacity: 0; pointer-events: none;
    transition: opacity .18s ease;
    max-width: min(90%, 460px);
    z-index: 40;
  }
  .toast.show { opacity: 1; }

  dialog {
    border: 1px solid var(--line);
    border-radius: 12px;
    padding: 0;
    max-width: 400px;
    width: calc(100% - 32px);
    color: var(--ink);
    background: var(--panel);
  }
  dialog::backdrop { background: rgba(20,20,24,.42); }
  dialog h2 { font-size: 16px; padding: 16px 16px 0; }
  dialog .body { padding: 14px 16px; }
  dialog .foot { display: flex; gap: 8px; justify-content: flex-end; padding: 0 16px 16px; }
  .err { color: var(--warn); font-size: 12px; min-height: 16px; margin-top: 6px; }

  .menu-wrap { position: relative; }
  .menu {
    position: absolute; right: 0; top: calc(100% + 6px);
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 8px;
    box-shadow: 0 6px 20px rgba(0,0,0,.14);
    padding: 5px;
    min-width: 200px;
    z-index: 30;
  }
  .menu button {
    display: block; width: 100%; text-align: left;
    font: inherit; font-size: 13px;
    border: 0; background: transparent; color: var(--ink);
    padding: 9px 10px; border-radius: 5px; cursor: pointer; min-height: 38px;
  }
  .menu button:hover { background: var(--line-2); }
  .menu hr { border: 0; border-top: 1px solid var(--line-2); margin: 5px 0; }

  .only-mobile { display: none; }

  /* ------------------------------------------------------------- mobile -- */

  @media (max-width: 899px) {
    .app {
      grid-template-columns: 1fr;
      grid-template-rows: var(--topbar-h) 1fr var(--mobilebar-h);
      grid-template-areas:
        "topbar"
        "stage"
        "mobilebar";
    }

    .only-mobile { display: initial; }
    .no-mobile { display: none !important; }

    /* Everything in the top bar has to fit 390px without a horizontal scroll. */
    .topbar { gap: 7px; padding: 0 8px; }
    .brand { display: none; }
    #floorSelect { min-width: 0 !important; max-width: 124px; flex: 0 1 auto; }
    .topbar .seg button { padding: 6px 9px; }

    /* One bottom sheet holding every panel. */
    .dock {
      display: flex;
      flex-direction: column;
      position: fixed;
      left: 0; right: 0; bottom: 0;
      height: 86dvh;
      background: var(--panel);
      border-top: 1px solid var(--line);
      border-radius: 16px 16px 0 0;
      box-shadow: 0 -6px 28px rgba(0,0,0,.16);
      z-index: 25;
      transform: translateY(var(--dock-y, 100%));
      transition: transform .26s cubic-bezier(.22,.61,.36,1);
      touch-action: none;
    }
    .dock.is-dragging { transition: none; }
    .dock[data-state="closed"] { --dock-y: 100%; }
    .dock[data-state="peek"]   { --dock-y: 56%; }
    .dock[data-state="full"]   { --dock-y: 0%; }

    .dock-handle {
      display: block;
      padding: 9px 0 5px;
      flex: 0 0 auto;
      cursor: grab;
    }
    .dock-handle::before {
      content: "";
      display: block;
      width: 40px; height: 4px;
      margin: 0 auto;
      border-radius: 2px;
      background: var(--line);
    }

    .dock-tabs {
      display: flex;
      gap: 4px;
      padding: 4px 10px 9px;
      border-bottom: 1px solid var(--line-2);
      flex: 0 0 auto;
      overflow-x: auto;
    }
    .dock-tabs button {
      font: inherit; font-size: 13px;
      border: 0; background: transparent; color: var(--muted);
      padding: 7px 12px; border-radius: 6px; cursor: pointer; white-space: nowrap;
      min-height: 36px;
    }
    .dock-tabs button[aria-pressed="true"] { background: var(--accent-soft); color: var(--accent); font-weight: 500; }

    .panel {
      border: 0 !important;
      flex: 1 1 auto;
      padding-bottom: calc(16px + env(safe-area-inset-bottom));
    }
    .panel[hidden] { display: none; }

    .mobilebar {
      grid-area: mobilebar;
      display: flex;
      align-items: stretch;
      background: var(--panel);
      border-top: 1px solid var(--line);
      padding-bottom: env(safe-area-inset-bottom);
      z-index: 26;
    }
    .mobilebar button {
      flex: 1 1 0;
      font: inherit; font-size: 11px;
      border: 0; background: transparent; color: var(--muted);
      display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px;
      cursor: pointer; min-height: 44px;
    }
    .mobilebar button[aria-pressed="true"] { color: var(--accent); }
    .mobilebar .ic { font-size: 17px; line-height: 1; }

    .stage-hud { left: 8px; bottom: 8px; padding: 5px 8px; }
    .zoomers { right: 8px; bottom: 8px; }
    .swatches { grid-template-columns: repeat(7, 1fr); }
    .row label { flex: 0 0 74px; }
  }

  @media (prefers-reduced-motion: reduce) {
    .dock { transition: none; }
    .toast { transition: none; }
  }
</style>

  <meta name="theme-color" content="#140a18">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Kickoff">
  <link rel="apple-touch-icon" href="assets/icons/apple-touch-icon.png">
  <link rel="icon" href="assets/icons/favicon.png">

<body>

<div class="app">
  <header class="topbar">
    <div class="brand">Decor<span>ator</span></div>

    <select id="floorSelect" style="width:auto;min-width:112px" aria-label="Floor"></select>

    <div class="seg" role="group" aria-label="View">
      <button type="button" id="modePlan" aria-pressed="true">Plan</button>
      <button type="button" id="modeElev" aria-pressed="false">Wall</button>
    </div>

    <div class="spacer"></div>

    <button type="button" class="btn btn--icon" id="undoBtn" title="Undo (Ctrl+Z)" aria-label="Undo">↺</button>
    <button type="button" class="btn btn--icon" id="redoBtn" title="Redo (Ctrl+Shift+Z)" aria-label="Redo">↻</button>

    <div class="menu-wrap no-mobile">
      <button type="button" class="btn" id="menuBtn" aria-expanded="false">File</button>
    </div>
  </header>

  <main class="stage">
    <svg id="canvas" role="img" aria-label="Floor plan"></svg>

    <div class="stage-hud">
      <div class="scalebar">
        <div class="bar" id="scaleBar" style="width:80px"></div>
        <div class="txt" id="scaleTxt">1 m</div>
      </div>
      <div class="compass" id="compass" title="North points right on this plan">N&nbsp;→</div>
    </div>

    <div class="zoomers">
      <button type="button" class="btn btn--icon" id="zoomIn" aria-label="Zoom in">+</button>
      <button type="button" class="btn btn--icon" id="zoomOut" aria-label="Zoom out">−</button>
      <button type="button" class="btn btn--icon" id="zoomFit" aria-label="Fit to view" title="Fit">⤢</button>
    </div>

    <div class="toast" id="toast" role="status" aria-live="polite"></div>
  </main>

  <div class="dock" id="dock" data-state="closed">
    <div class="dock-handle" id="dockHandle" role="button" tabindex="-1" aria-label="Resize panel"></div>
    <div class="dock-tabs" id="dockTabs">
      <button type="button" data-tab="catalog" aria-pressed="true">Add</button>
      <button type="button" data-tab="inspector" aria-pressed="false">Properties</button>
    </div>

    <aside class="panel" id="panelCatalog">
      <div class="section">
        <h2>Add furniture</h2>
        <p class="hint" id="catalogHint">Tap to drop into the middle of the view, or drag straight onto the plan.</p>
        <button type="button" class="btn btn--primary btn--block" id="addCustomBtn" style="margin-top:9px">+ New piece from dimensions</button>
      </div>
      <div class="section" id="catalogBody"></div>
    </aside>

    <aside class="panel" id="panelInspector">
      <div id="inspectorBody"></div>
    </aside>
  </div>

  <nav class="mobilebar" id="mobilebar" aria-label="Tools">
    <button type="button" data-open="catalog"><span class="ic">＋</span>Add</button>
    <button type="button" data-open="inspector"><span class="ic">⚙</span>Properties</button>
    <button type="button" data-open="walls"><span class="ic">▤</span>Walls</button>
    <button type="button" data-open="file"><span class="ic">⤓</span>File</button>
  </nav>
</div>

<dialog id="addDialog">
  <h2>New piece of furniture</h2>
  <form method="dialog" class="body" id="addForm">
    <div class="rows">
      <div class="row"><label for="fName">Name</label><input type="text" id="fName" required placeholder="Hall bench"></div>
      <div class="row"><label for="fW">Width</label><input type="number" id="fW" min="1" step="10" value="1000" required><span class="hint">mm</span></div>
      <div class="row"><label for="fD">Depth</label><input type="number" id="fD" min="1" step="10" value="500" required><span class="hint">mm</span></div>
      <div class="row"><label for="fH">Height</label><input type="number" id="fH" min="1" step="10" value="750" required><span class="hint">mm</span></div>
      <div class="row"><label for="fShape">Shape</label>
        <select id="fShape"><option value="rect">Rectangle</option><option value="ellipse">Round / oval</option></select>
      </div>
      <div class="row"><label for="fColor">Colour</label><input type="color" id="fColor" value="#b9b2a4"></div>
    </div>
    <p class="err" id="addErr"></p>
  </form>
  <div class="foot">
    <button type="button" class="btn" id="addCancel">Cancel</button>
    <button type="button" class="btn btn--primary" id="addSave">Add to plan</button>
  </div>
</dialog>

<input type="file" id="fileInput" accept="application/json,.json" hidden>

<script src="js/decorator-house.js?v=17891724"></script>
